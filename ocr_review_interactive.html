<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>附件分类确认与OCR指标录入</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Microsoft YaHei",Arial;color:#26344d;background:#eef2f7}.app{width:min(1280px,100vw);height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}.top{height:48px;border-bottom:1px solid #e3e8f1;padding:13px 16px;font-weight:700;font-size:16px}.top span{color:#7b879c;font-weight:400;margin-left:18px}.main{display:grid;grid-template-columns:39% 61%;min-height:0;flex:1}.left,.right{padding:14px 18px;overflow:auto}.left{border-right:1px solid #e3e8f1}.title{font-weight:700;margin-bottom:14px}.title:before{content:"";display:inline-block;width:5px;height:17px;background:#2468ed;border-radius:3px;margin-right:9px;vertical-align:-3px}.thumbs{display:flex;gap:10px;margin-bottom:15px}.thumb{width:86px;height:84px;border:1px solid #d9e0eb;background:#fff;border-radius:4px;cursor:pointer;padding:6px}.thumb.on{border:2px solid #2468ed;box-shadow:0 2px 7px #2468ed33}.thumb i{display:block;height:52px;background:#f1f2f4;border:1px solid #e5e5e5}.thumb small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer{height:560px;border:1px solid #e2e7ef;border-radius:5px}.tabs{height:48px;border-bottom:1px solid #e2e7ef;display:flex}.tab{border:0;background:#fff;padding:0 28px;color:#68758b;font-weight:600;cursor:pointer}.tab.on{color:#2468ed;border-bottom:3px solid #2468ed}.units{padding:12px;display:flex;gap:8px;align-items:center}.unit{border:1px solid #d6deea;background:#fff;padding:7px 14px;border-radius:4px;color:#68758b;cursor:pointer}.unit.on{border-color:#2468ed;color:#2468ed;background:#f5f8ff}.canvas{margin:0 12px 12px;height:445px;border:1px solid #e2e7ef;padding:18px;overflow:auto}.paper{height:100%;background:#f2f3f5;display:grid;place-items:center}.paper:after{content:"入 院 记 录\A\A姓名：张三　性别：男\A\A入院日期：2025-05-15\A\A主诉：胸痛伴心悸";white-space:pre;text-align:center;width:70%;height:80%;padding:50px;background:#fff;border:1px solid #ccc}.ocr p{margin:0 0 14px}.field{display:flex;gap:10px;align-items:center;margin:9px 0}.field label{width:100px}.select{height:34px;border:1px solid #d4dce8;border-radius:4px;padding:0 10px;background:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #d4dce8;background:#fff;padding:7px 11px;border-radius:4px;cursor:pointer}.chip.on{border-color:#2468ed;color:#2468ed;background:#f6f9ff}.divider{border-bottom:1px solid #d7dde7;padding:10px 0 7px;margin-bottom:8px}.acc-head{margin-top:16px;border-top:1px solid #e3e8f1;padding:12px 0 9px;display:flex;align-items:center;gap:12px;cursor:pointer}.fold{width:18px;height:18px;border:1px solid #d3dbe7;border-radius:3px;background:#fff}.muted{color:#7b879c}.box{border:1px solid #e2e7ef;padding:0 14px 14px}.row{display:grid;grid-template-columns:28px 105px 1fr;gap:9px;align-items:start;padding:11px 0;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.row>label{font-weight:600;padding-top:7px}.cb{width:16px;height:16px;accent-color:#2468ed;margin-top:8px}.input,.textarea,.cell{border:1px solid #d4dce8;border-radius:4px;color:#526078;background:#fff}.input{height:34px;padding:0 9px;max-width:230px}.textarea{width:100%;height:76px;padding:9px;resize:vertical}.tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid #d4dce8;background:#fff;color:#2468ed;padding:4px 7px}.tablewrap{border:1px solid #e2e7ef;overflow-x:auto}.table{min-width:760px}.tr{display:grid;grid-template-columns:75px 1.5fr 1fr 1fr 1.15fr;min-height:46px;border-bottom:1px solid #e5eaf1}.tr.head{background:#f7f9fc;font-weight:700}.tr>div{padding:7px;border-right:1px solid #e5eaf1;display:flex;align-items:center}.cell{height:31px;width:100%;padding:0 7px}.content-head{height:40px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5eaf1;font-weight:600}.danger{margin-left:auto;border:0;background:none;color:#ef4444}.link{border:0;background:none;color:#2468ed;padding:10px 0;cursor:pointer}.footer{height:64px;border-top:1px solid #e2e7ef;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 18px}.btn{height:36px;border:1px solid #d2dae6;background:#fff;border-radius:4px;padding:0 17px}.primary{background:#2468ed;color:#fff;border-color:#2468ed}@media(max-width:900px){.main{grid-template-columns:1fr}.app{height:auto}}
</style></head><body><div class="app"><div class="top">附件分类确认与OCR指标录入<span>SandeepRathi · 基线记录 2025-05-27</span></div><div class="main">
<aside class="left"><div class="title">全部附件(3)</div><div class="thumbs" id="thumbs"></div><div class="viewer"><div class="tabs"><button class="tab" data-v="paper">原图</button><button class="tab on" data-v="ocr">OCR文本</button></div><div class="units">识别单元：<button class="unit on" data-u="ad">入院记录</button><button class="unit" data-u="his">病史采集</button></div><div class="canvas" id="canvas"></div></div></aside>
<section class="right"><div class="title">待录入　|　AI结构化完成度：0%</div><div class="field"><label>CRF一级分类</label><select class="select"><option>合规</option><option selected>诊疗</option><option>检查</option></select></div><div class="divider">二级分类标签</div><div class="chips" id="chips"></div><div class="divider">当前图片组</div><div class="chips"><button class="chip">肝功能P1</button><button class="chip">肝功能P2</button><button class="chip on">肝功能P3</button></div><div id="sections"></div></section></div><div class="footer"><button class="btn">取消</button><button class="btn primary">确认分类并标记SDV</button><button class="btn primary">确认并录入EDC</button></div></div>
<script>
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
const texts={ad:'<p><b>姓名：</b>张三　<b>性别：</b>男　<b>年龄：</b>45岁</p><p><b>入院日期：</b>2025-05-15</p><p><b>主诉：</b>患者主诉胸痛伴心悸已有1-2天</p><p><b>现病史：</b>患者近两日反复出现胸部不适，伴心悸、乏力。</p>',his:'<p><b>现病史：</b>中枢性胸痛、心悸、烧灼感，无发热。</p><p><b>个人史：</b>已婚，食欲和排尿正常，无过敏。</p><p><b>家族史：</b>无糖尿病、高血压、癌症、肺结核、中风。</p><p><b>既往史：</b>近期无手术史，无出血史。</p>'};let view='ocr',unit='ad';function left(){canvas.className='canvas '+view;canvas.innerHTML=view==='paper'?'<div class="paper"></div>':texts[unit]}left();
thumbs.innerHTML=['血脂全套','肝功能','入院记录'].map((x,i)=>'<button class="thumb '+(i===2?'on':'')+'"><i></i><small>'+x+'</small></button>').join('');thumbs.onclick=e=>{const b=e.target.closest('.thumb');if(b){qa('.thumb').forEach(x=>x.classList.remove('on'));b.classList.add('on')}};
qa('.tab').forEach(b=>b.onclick=()=>{qa('.tab').forEach(x=>x.classList.toggle('on',x===b));view=b.dataset.v;q('.units').style.visibility=view==='ocr'?'visible':'hidden';left()});qa('.unit').forEach(b=>b.onclick=()=>{qa('.unit').forEach(x=>x.classList.toggle('on',x===b));unit=b.dataset.u;left()});
const names=['入院记录','手术记录','出院记录','知情同意书','合并用药','全血细胞分析','肝功能','肾功能','血糖测定','凝血检查','血脂全套','心肌酶谱','电解质','心脏彩超'];chips.innerHTML=names.map((x,i)=>'<button class="chip '+([0,1,2,4,6,10].includes(i)?'on':'')+'">'+x+'</button>').join('');chips.onclick=e=>e.target.classList.contains('chip')&&e.target.classList.toggle('on');
function sec(name,meta,content){return '<div class="acc-head"><button class="fold">−</button><b>'+name+'</b><span class="muted">'+meta+'</span><span class="muted status">待确认</span></div><div class="box">'+content+'</div>'}
function field(name,val,tag=''){return '<div class="row"><input class="cb track" type="checkbox"><label>'+name+'</label><div><textarea class="textarea">'+val+'</textarea>'+(tag?'<div class="tags"><button class="tag">'+tag+' ×</button></div>':'')+'</div></div>'}
const liver='<div class="tablewrap"><div class="table"><div class="tr head"><div></div><div>指标</div><div>英文缩写</div><div>结果</div><div>参考范围/单位</div></div>'+[['丙氨酸氨基转移酶','ALT','62.81','0-40U/L'],['门冬氨酸氨基转移酶','AST','71.4','0-40U/L'],['碱性磷酸酶','ALP','','20-110U/L']].map(r=>'<div class="tr"><div><input class="cb track" type="checkbox"></div><div>'+r[0]+'</div><div>'+r[1]+'</div><div><input class="cell" value="'+r[2]+'"></div><div>'+r[3]+'</div></div>').join('')+'</div></div>';
const meds=[['阿司匹林肠溶片','100mg','75mg','qd(每日1次)'],['替格瑞洛片','90mg','90mg','bid(每日2次)'],['阿托伐他汀钙片','20mg','40mg','qd(每日1次)']];
function medtable(id,title){return '<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:600"><input class="cb track" type="checkbox">'+title+'</label><div class="tablewrap"><div class="table"><div class="tr head"><div>序号</div><div>药品名称</div><div>规格</div><div>单次用量</div><div>频率</div></div>'+meds.map((r,i)=>'<div class="tr"><div>'+(i+1)+'</div>'+r.map(x=>'<div><input class="cell" value="'+x+'"></div>').join('')+'</div>').join('')+'</div></div>'}
const admission='<div class="row"><input class="cb track" type="checkbox"><label>入院日期</label><input class="input" type="date" value="2025-05-15"></div>'+field('入院原因','首次入院')+field('主诉','患者主诉胸痛伴心悸已有1-2天','眼红')+field('计划二次入院','是，2025-06-15');
const history=['现病史','个人史','家族史','既往史'].map((x,i)=>field(x,texts.his.replace(/<[^>]+>/g,'').slice(i*28,i*28+55),'结构化标签')).join('');
const surgery='<div class="content-head"><label><input class="cb track" type="checkbox"> 手术一</label><button class="danger">删除</button></div><div class="row" style="grid-template-columns:105px 1fr"><label>手术日期</label><input class="input" type="date" value="2025-05-16"></div>'+field('手术结论','成功完成PCI，支架置入LAD。','造影：左优势型冠脉')+'<button class="link" id="addS">＋新增手术记录</button>';
const discharge='<div class="row"><input class="cb track" type="checkbox"><label>出院日期</label><input class="input" type="date" value="2025-05-19"></div>'+field('出院诊断','后壁ST段抬高型心肌梗死','冠心病CHD·急性冠脉综合征ACS')+'<div class="row"><input class="cb track" type="checkbox"><label>开始用药时间</label><input class="input" type="date" value="2025-05-19"></div>'+medtable('dc','出院带药');
sections.innerHTML=sec('肝功能','3个指标',liver)+sec('合并用药','3条用药记录',medtable('merge','合并用药'))+sec('入院记录','4个字段',admission)+sec('病史采集','4个指标',history)+sec('手术记录','1条手术记录',surgery)+sec('出院记录','4个指标',discharge);
qa('.acc-head').forEach(h=>h.onclick=()=>{const b=h.nextElementSibling;b.hidden=!b.hidden;h.querySelector('.fold').textContent=b.hidden?'+':'−'});qa('.box').forEach(b=>{const c=qa.call?[]:[];b.querySelectorAll('.track').forEach(x=>x.onchange=()=>{const all=[...b.querySelectorAll('.track')],n=all.filter(y=>y.checked).length;b.previousElementSibling.querySelector('.status').textContent=n+'/'+all.length+' 已确认'})});
</script></body></html>
