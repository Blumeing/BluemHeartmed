<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>附件分类确认与OCR指标录入</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Microsoft YaHei",Arial;color:#26344d;background:#eef2f7}.app{width:min(1280px,100vw);height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}.top{height:48px;border-bottom:1px solid #e3e8f1;padding:13px 16px;font-weight:700;font-size:16px}.top span{margin-left:18px;color:#7b879c;font-weight:400}.main{display:grid;grid-template-columns:39% 61%;min-height:0;flex:1}.left,.right{padding:14px 18px;overflow:auto}.left{border-right:1px solid #e3e8f1}.title{font-weight:700;margin-bottom:14px}.title:before{content:"";display:inline-block;width:5px;height:17px;background:#2468ed;border-radius:3px;margin-right:9px;vertical-align:-3px}.thumbs{display:flex;gap:10px;margin-bottom:15px}.thumb{width:86px;height:84px;border:1px solid #d9e0eb;background:#fff;border-radius:4px;padding:6px;cursor:pointer}.thumb.on{border:2px solid #2468ed;box-shadow:0 2px 7px #2468ed33}.thumb i{display:block;height:52px;background:#f1f2f4}.thumb small{white-space:nowrap}.viewer{height:590px;border:1px solid #e2e7ef;border-radius:5px}.tabs{height:48px;border-bottom:1px solid #e2e7ef;display:flex}.tab{border:0;background:#fff;padding:0 28px;color:#68758b;font-weight:600;cursor:pointer}.tab.on{color:#2468ed;border-bottom:3px solid #2468ed}.canvas{height:540px;padding:14px;overflow:auto;background:#f7f9fc}.paper{height:100%;background:#eef0f3;display:grid;place-items:center}.paper:after{content:"检 验 报 告 单\A\A12导联心电图\A\A检查日期：2026-02-06\A\A诊断结论：正常心电图";white-space:pre;text-align:center;width:72%;height:82%;padding:55px;background:#fff;border:1px solid #cfd5df}.report{background:#fff;border-radius:8px;padding:18px 20px;min-height:500px}.report h2{margin:0 0 20px;font-size:18px}.report h2:before{content:"";display:inline-block;width:5px;height:20px;background:#2468ed;margin-right:10px;vertical-align:-4px}.report-type{background:#f7f9fc;padding:14px 20px;font-size:17px;font-weight:700}.dot{display:inline-block;width:12px;height:12px;background:#2f6deb;border-radius:50%;margin-right:8px}.info{display:grid;grid-template-columns:100px 1fr;gap:16px 8px;margin:20px 28px}.info b{text-align:right}.tag{border:1px solid #d4dce8;background:#fff;color:#2468ed;padding:5px 9px;margin-right:6px}.report table{width:calc(100% - 120px);margin-left:120px;border-collapse:collapse}.report th{background:#f7f9fc;text-align:left;padding:12px}.report td{padding:12px;border-bottom:1px solid #e4e9f1}.field{display:flex;gap:10px;align-items:center;margin:9px 0}.field label{width:100px}.select,.input,.cell,.textarea{border:1px solid #d4dce8;border-radius:4px;color:#526078;background:#fff}.select,.input{height:34px;padding:0 10px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #d4dce8;background:#fff;padding:7px 11px;border-radius:4px;cursor:pointer}.chip.on{border-color:#2468ed;color:#2468ed;background:#f6f9ff}.divider{border-bottom:1px solid #d7dde7;padding:10px 0 7px;margin-bottom:8px}.acc-head{margin-top:16px;border-top:1px solid #e3e8f1;padding:12px 0 9px;display:flex;align-items:center;gap:12px;cursor:pointer}.unit-check{width:16px;height:16px;margin:0;accent-color:#2468ed;cursor:pointer}.fold{width:18px;height:18px;border:1px solid #d3dbe7;border-radius:3px;background:#fff}.muted{color:#7b879c}.box{border:1px solid #e2e7ef;padding:0 14px 14px}.row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid #edf0f5}.row>label{font-weight:600;padding-top:7px}.textarea{width:100%;height:72px;padding:9px;resize:vertical}.tags{margin-top:6px}.tablewrap{border:1px solid #e2e7ef;overflow:auto}.table{min-width:720px}.tr{display:grid;grid-template-columns:65px 1.5fr 1fr 1fr 1.2fr;min-height:45px;border-bottom:1px solid #e5eaf1}.tr.head{background:#f7f9fc;font-weight:700}.tr>div{padding:7px;border-right:1px solid #e5eaf1;display:flex;align-items:center}.cell{height:31px;width:100%;padding:0 7px}.content-head{height:40px;display:flex;align-items:center;border-bottom:1px solid #e5eaf1;font-weight:600}.danger{margin-left:auto;border:0;background:none;color:#ef4444}.link{border:0;background:none;color:#2468ed;padding:10px 0}.footer{height:64px;border-top:1px solid #e2e7ef;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 18px}.btn{height:36px;border:1px solid #d2dae6;background:#fff;border-radius:4px;padding:0 17px}.primary{background:#2468ed;color:#fff}@media(max-width:900px){.main{grid-template-columns:1fr}.app{height:auto}}
</style></head><body><div class="app"><div class="top">附件分类确认与OCR指标录入<span>SandeepRathi · 基线记录 2025-05-27</span></div><div class="main"><aside class="left"><div class="title">全部附件(3)</div><div class="thumbs" id="thumbs"></div><div class="viewer"><div class="tabs"><button class="tab" data-v="paper">原图</button><button class="tab on" data-v="report">OCR识别值</button></div><div class="canvas" id="canvas"></div></div></aside><section class="right"><div class="title">待录入　|　AI结构化完成度：0%</div><div class="field"><label>CRF一级分类</label><select class="select"><option>合规</option><option selected>诊疗</option><option>检查</option></select></div><div class="divider">二级分类标签</div><div class="chips" id="chips"></div><div class="divider">当前图片组</div><div class="chips"><button class="chip">肝功能P1</button><button class="chip">肝功能P2</button><button class="chip on">肝功能P3</button></div><div id="sections"></div></section></div><div class="footer"><button class="btn">取消</button><button class="btn primary">确认分类并标记SDV</button><button class="btn primary">确认并录入EDC</button></div></div>
<script>
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];const report='<div class="report"><h2>检验报告单</h2><div class="report-type"><i class="dot"></i>12导联心电图</div><div class="info"><b>检查日期：</b><span>2026-02-06</span><b>检查附件：</b><span style="color:#2468ed">🔗 1个附件</span><b>诊断结论：</b><span><button class="tag">正常心电图</button><button class="tag">窦性心动过缓</button></span><b>表格信息：</b><span></span></div><table><thead><tr><th>项目</th><th>结果</th><th>单位</th><th>正常范围</th></tr></thead><tbody><tr><td>心率HR</td><td>58</td><td>bmp</td><td>60-100</td></tr><tr><td>P</td><td>3</td><td>ms</td><td></td></tr><tr><td>PR间期</td><td>159</td><td>ms</td><td></td></tr><tr><td>QRS间期</td><td>84</td><td>ms</td><td></td></tr><tr><td>T</td><td>--</td><td>ms</td><td></td></tr></tbody></table></div>';function show(v){canvas.innerHTML=v==='paper'?'<div class="paper"></div>':report}show('report');
thumbs.innerHTML=['血脂全套','肝功能','入院记录'].map((x,i)=>'<button class="thumb '+(i===2?'on':'')+'"><i></i><small>'+x+'</small></button>').join('');thumbs.onclick=e=>{const b=e.target.closest('.thumb');if(b){qa('.thumb').forEach(x=>x.classList.remove('on'));b.classList.add('on')}};qa('.tab').forEach(b=>b.onclick=()=>{qa('.tab').forEach(x=>x.classList.toggle('on',x===b));show(b.dataset.v)});
const names=['入院记录','手术记录','出院记录','知情同意书','合并用药','全血细胞分析','肝功能','肾功能','血糖测定','凝血检查','血脂全套','心肌酶谱','电解质','心脏彩超'];chips.innerHTML=names.map((x,i)=>'<button class="chip '+([0,1,2,4,6,10].includes(i)?'on':'')+'">'+x+'</button>').join('');chips.onclick=e=>e.target.classList.contains('chip')&&e.target.classList.toggle('on');
function sec(n,m,c){return '<div class="acc-head"><button class="fold">−</button><input class="unit-check" type="checkbox" checked aria-label="选择'+n+'单元"><b>'+n+'</b><span class="muted">'+m+'</span></div><div class="box">'+c+'</div>'}function field(n,v,t=''){return '<div class="row"><label>'+n+'</label><div><textarea class="textarea">'+v+'</textarea>'+(t?'<div class="tags">'+t.split('|').map(x=>'<button class="tag">'+x+' ×</button>').join('')+'</div>':'')+'</div></div>'}function dateField(n,v){return '<div class="row"><label>'+n+'</label><div><input class="input" type="date" value="'+v+'"></div></div>'}function radioField(n,items,active){return '<div class="row"><label>'+n+'</label><div style="padding-top:7px">'+items.map(x=>'<label style="margin-right:20px;font-weight:400"><input type="radio" name="'+n+'" '+(x===active?'checked':'')+'> '+x+'</label>').join('')+'</div></div>'}const meds=[['阿司匹林肠溶片','100mg','75mg','qd(每日1次)'],['替格瑞洛片','90mg','90mg','bid(每日2次)'],['阿托伐他汀钙片','20mg','40mg','qd(每日1次)']];function table(title){return '<b style="display:block;margin:10px 0">'+title+'</b><div class="tablewrap"><div class="table"><div class="tr head"><div>序号</div><div>名称</div><div>规格</div><div>用量</div><div>频率</div></div>'+meds.map((r,i)=>'<div class="tr"><div>'+(i+1)+'</div>'+r.map(x=>'<div><input class="cell" value="'+x+'"></div>').join('')+'</div>').join('')+'</div></div>'}
const liver='<div class="tablewrap"><div class="table"><div class="tr head"><div>序号</div><div>指标</div><div>英文缩写</div><div>结果</div><div>参考范围</div></div>'+[['ALT','丙氨酸氨基转移酶','62.81','0-40U/L'],['AST','门冬氨酸氨基转移酶','71.4','0-40U/L']].map((r,i)=>'<div class="tr"><div>'+(i+1)+'</div><div>'+r[1]+'</div><div>'+r[0]+'</div><div><input class="cell" value="'+r[2]+'"></div><div>'+r[3]+'</div></div>').join('')+'</div></div>';
sections.innerHTML=sec('肝功能','14个指标',liver)+sec('合并用药','3条用药记录',table('合并用药'))+sec('入院记录','4个字段',dateField('入院日期','2025-05-15')+radioField('入院原因',['首次入院','计划入院','其他非不良事件','不良事件'],'首次入院')+field('主诉','患者主诉胸痛伴心悸已有1-2天','眼红|眼眶胀痛'))+sec('病史采集','4个指标',field('现病史','有上述症状的患者，中枢性胸痛、心悸、烧灼感，胸部憋闷区，无发热，食欲和消化问题。','胸痛|心悸')+field('个人史','已婚，食欲和排尿正常，无过敏','既往吸烟|既往饮酒')+field('家族史','无糖尿病、高血压、癌症、肺结核、中风','肿瘤疾病家族史')+field('既往史','近期无手术史，无出血史','代谢性疾病-糖尿病:I型糖尿病T1DM'))+sec('手术记录','1条记录','<div class="content-head">手术一<button class="danger">删除</button></div>'+dateField('手术日期','2025-05-16')+field('手术结论','成功完成PCI，支架置入LAD')+'<button class="link">＋新增手术记录</button>')+sec('出院记录','4个指标',dateField('出院日期','2025-05-19')+field('出院诊断','后壁ST段抬高型心肌梗死')+dateField('开始用药时间','2025-05-19')+table('出院带药'));qa('.unit-check').forEach(c=>c.onclick=e=>e.stopPropagation());qa('.acc-head').forEach(h=>h.onclick=()=>{const b=h.nextElementSibling;b.hidden=!b.hidden;h.querySelector('.fold').textContent=b.hidden?'+':'−'});
</script></body></html>
