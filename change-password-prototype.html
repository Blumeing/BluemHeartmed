<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>病历档案数据校验平台 - 修改密码</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #102247; background: linear-gradient(120deg, #d9ecff 0%, #eef6ff 48%, #cfe7ff 100%); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .page-bg { min-height: 100vh; background: radial-gradient(circle at 18% 0%, rgba(255,255,255,.82), transparent 28%), radial-gradient(circle at 80% 18%, rgba(255,255,255,.65), transparent 34%); }
    .topbar { height: 86px; padding: 24px 28px 10px 34px; display: flex; align-items: flex-start; justify-content: space-between; }
    .logo-mark { width: 31px; height: 31px; border: 4px solid #27c7df; border-right-color: transparent; border-radius: 7px; position: relative; }
    .logo-mark::after { content: ""; position: absolute; right: -12px; top: 7px; width: 18px; height: 12px; border: 4px solid #2f7df6; border-left: 0; border-radius: 0 5px 5px 0; }
    .user-trigger { height: 36px; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; color: #102247; padding: 0 8px; }
    .user-trigger:hover { color: #2362d8; }
    .user-menu { position: absolute; right: 102px; top: 63px; width: 246px; background: rgba(255,255,255,.98); border: 1px solid #d5e4f8; box-shadow: 0 12px 30px rgba(43, 86, 145, .18); display: none; z-index: 30; }
    .user-menu.open { display: block; }
    .menu-head { padding: 14px 16px; border-bottom: 1px solid #edf2f9; color: #667895; font-size: 13px; }
    .menu-item { width: 100%; border: 0; background: white; display: flex; align-items: center; gap: 11px; padding: 12px 16px; color: #17315e; text-align: left; }
    .menu-item:hover { background: #edf5ff; color: #2f6fee; }
    .side { position: fixed; left: 18px; top: 100px; bottom: 20px; width: 248px; background: white; border-radius: 4px; padding: 28px 18px; box-shadow: 0 8px 18px rgba(57, 103, 164, .08); }
    .side-item { height: 49px; display: flex; align-items: center; gap: 12px; padding: 0 26px; color: #102247; border-radius: 6px; margin: 3px 0; }
    .side-item.active { background: #e6efff; color: #2f6fee; }
    .content { margin-left: 292px; padding: 12px 26px 26px 0; }
    .section-title { font-size: 31px; font-weight: 800; letter-spacing: .5px; margin: 0 0 20px; }
    .select-line { display: flex; justify-content: flex-end; margin-bottom: 24px; }
    .project-select { width: 548px; height: 35px; border: 1px solid #d7e1ef; background: white; color: #162846; padding: 0 14px; }
    .panel { background: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.9); border-radius: 5px; padding: 28px; margin-bottom: 28px; }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; margin: 18px 0 32px; }
    .stat { height: 98px; background: rgba(255,255,255,.88); border-radius: 5px; padding: 18px; }
    .stat b { display: block; font-size: 30px; margin-top: 6px; }
    .table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,.86); }
    .table th, .table td { padding: 17px 14px; text-align: left; border-bottom: 1px solid #edf1f7; font-weight: 400; }
    .empty { height: 92px; text-align: center; color: #71809a; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(16, 34, 71, .38); align-items: center; justify-content: center; padding: 24px; z-index: 50; }
    .modal.open { display: flex; }
    .dialog { width: min(530px, 100%); background: white; border-radius: 4px; box-shadow: 0 24px 76px rgba(16, 34, 71, .24); }
    .field-error { min-height: 18px; margin-top: 4px; color: #d92d20; font-size: 12px; }
    .rule-box { background: #f3f8ff; border: 1px solid #d9e9ff; color: #415775; padding: 12px 14px; line-height: 1.75; font-size: 13px; }
    .toast { position: fixed; top: 88px; left: 50%; transform: translateX(-50%); padding: 10px 18px; background: #0f9f5f; color: white; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 60; }
    .toast.show { opacity: 1; }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid rgba(47, 111, 238, .22); outline-offset: 2px; }
    @media(max-width: 980px) {
      .side { display: none; }
      .content { margin-left: 20px; padding-right: 20px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .project-select { width: 100%; }
      .topbar { padding-left: 20px; }
    }
  </style>
</head>
<body>
  <div class="page-bg">
    <header class="topbar">
      <div class="flex items-start gap-3">
        <div class="flex items-center gap-2 pt-1">
          <span class="logo-mark"></span>
          <span class="text-[20px] tracking-wide text-[#26bed6] font-medium">HEART<span class="text-[#2f7df6] font-bold">MED</span></span>
        </div>
        <div class="leading-tight">
          <div class="text-[20px] font-extrabold">病例档案数据校验平台</div>
          <div class="text-[13px] tracking-[4px]">识别、校对、审核、入库</div>
        </div>
      </div>
      <div class="relative flex items-start">
        <button id="userButton" class="user-trigger" aria-haspopup="true" aria-expanded="false">
          <i class="fas fa-user-circle text-[28px] text-[#2f6fee]"></i>
          <span>数据管理员</span>
          <i class="fas fa-chevron-down text-xs text-[#5f6f8a]"></i>
        </button>
        <div id="userMenu" class="user-menu" role="menu">
          <div class="menu-head">
            <div class="font-medium text-[#102247]">王彩文：数据管理员</div>
            <div class="mt-1">当前角色与账号操作</div>
          </div>
          <button id="switchRoleEntry" class="menu-item" role="menuitem"><i class="fas fa-user-gear text-[#2f6fee] w-4"></i><span>切换角色</span></button>
          <button id="changePasswordEntry" class="menu-item" role="menuitem"><i class="fas fa-key text-[#2f6fee] w-4"></i><span>修改密码</span></button>
          <button id="menuLogout" class="menu-item" role="menuitem"><i class="fas fa-right-from-bracket text-[#2f6fee] w-4"></i><span>退出登录</span></button>
        </div>
      </div>
    </header>

    <aside class="side">
      <p class="text-[#7484a0] mb-3">王彩文：数据管理员</p>
      <nav>
        <div class="side-item active"><i class="fas fa-folder-plus"></i><span>病例任务分配</span></div>
        <div class="side-item"><i class="far fa-address-card"></i><span>抽样管理</span></div>
        <div class="side-item"><i class="far fa-clipboard"></i><span>样本字段审核</span></div>
        <div class="side-item"><i class="far fa-share-square"></i><span>配置与导出</span></div>
      </nav>
      <div class="absolute left-0 right-0 bottom-0 h-11 border-t border-gray-100 flex items-center px-9 text-[#435370]"><i class="fas fa-bars"></i></div>
    </aside>

    <main class="content">
      <h1 class="section-title">病例任务分配</h1>
      <div class="select-line"><select class="project-select" aria-label="项目批次"><option>test0921 / test0921第一批</option></select></div>
      <section class="panel">
        <div class="flex items-center gap-4"><h2 class="font-bold text-[18px]">病例任务分配</h2><p class="text-[#71809a]">批量分配在弹窗中先选数量，再按各质检员的数量确认</p></div>
        <button class="mt-4 bg-[#2f6fee] text-white px-4 py-2 rounded-sm">新建分配批次</button>
        <div class="stats">
          <div class="stat"><span>病例总数</span><b>0</b></div><div class="stat"><span>未分配</span><b>0</b></div><div class="stat"><span>已分配</span><b>0</b></div><div class="stat"><span>未入库</span><b>0</b></div><div class="stat"><span>已入库</span><b>0</b></div>
        </div>
        <div class="flex justify-between"><strong>进度分析</strong><button class="border-0 bg-transparent text-[#2f6fee]">展开</button></div>
      </section>
      <section class="panel">
        <h2 class="font-bold text-[18px] mb-4">质检员任务概况</h2>
        <table class="table"><thead><tr><th>质检员</th><th>总任务</th><th>未入库</th><th>已校对</th><th>驳回待改</th><th>已入库</th></tr></thead><tbody><tr><td colspan="6" class="empty">暂无数据</td></tr></tbody></table>
      </section>
      <section class="panel">
        <div class="flex gap-8 border-b border-gray-200 mb-4"><button class="border-0 bg-transparent text-[#102247] font-bold pb-3 border-b-2 border-[#2f6fee]">未分配病例</button><button class="border-0 bg-transparent text-[#53647f] pb-3">已分配病例</button></div>
        <table class="table"><thead><tr><th>患者</th><th>任务状态</th><th>校对进度</th><th>单例重新分配</th></tr></thead><tbody><tr><td colspan="4" class="empty">暂无数据</td></tr></tbody></table>
      </section>
    </main>
  </div>

  <div id="passwordModal" class="modal" aria-hidden="true">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h2 id="passwordTitle" class="text-lg font-semibold">修改密码</h2>
        <button id="closeModal" class="w-8 h-8 border-0 bg-transparent text-[#53647f]" aria-label="关闭"><i class="fas fa-xmark"></i></button>
      </div>
      <form id="passwordForm" class="px-6 py-5">
        <div class="rule-box mb-4">
          <strong class="block text-[#102247] mb-1">新密码规范</strong>
          <p>新密码长度至少 8 位，必须同时包含字母和数字，不能与原密码相同。</p>
        </div>
        <label class="block text-sm font-medium mb-1" for="oldPassword">原密码 <span class="text-red-500">*</span></label>
        <input id="oldPassword" type="password" class="w-full border border-gray-300 rounded-sm px-3 py-2" autocomplete="current-password">
        <div id="oldPasswordError" class="field-error"></div>
        <label class="block text-sm font-medium mb-1 mt-3" for="newPassword">新密码 <span class="text-red-500">*</span></label>
        <input id="newPassword" type="password" class="w-full border border-gray-300 rounded-sm px-3 py-2" autocomplete="new-password" placeholder="至少 8 位，包含字母和数字">
        <div id="newPasswordError" class="field-error"></div>
        <label class="block text-sm font-medium mb-1 mt-3" for="confirmPassword">确认新密码 <span class="text-red-500">*</span></label>
        <input id="confirmPassword" type="password" class="w-full border border-gray-300 rounded-sm px-3 py-2" autocomplete="new-password">
        <div id="confirmPasswordError" class="field-error"></div>
        <div class="flex justify-end gap-3 mt-6"><button type="button" id="cancelModal" class="px-4 py-2 border border-gray-300 rounded-sm bg-white">取消</button><button type="submit" class="px-4 py-2 rounded-sm bg-[#2f6fee] text-white">确认修改</button></div>
      </form>
    </section>
  </div>

  <div id="roleModal" class="modal" aria-hidden="true">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="roleTitle">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h2 id="roleTitle" class="text-lg font-semibold">切换角色</h2>
        <button id="closeRoleModal" class="w-8 h-8 border-0 bg-transparent text-[#53647f]" aria-label="关闭"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="px-6 py-5">
        <label class="block text-sm font-medium mb-1" for="roleSelect">选择角色</label>
        <select id="roleSelect" class="w-full border border-gray-300 rounded-sm px-3 py-2"><option>数据管理员</option><option>数据质检员</option></select>
        <div class="flex justify-end gap-3 mt-6"><button type="button" id="cancelRoleModal" class="px-4 py-2 border border-gray-300 rounded-sm bg-white">取消</button><button type="button" id="confirmRole" class="px-4 py-2 rounded-sm bg-[#2f6fee] text-white">确认切换</button></div>
      </div>
    </section>
  </div>
  <div id="toast" class="toast" role="status">操作成功</div>

  <script>
    const userButton = document.getElementById('userButton');
    const userMenu = document.getElementById('userMenu');
    const passwordModal = document.getElementById('passwordModal');
    const roleModal = document.getElementById('roleModal');
    const form = document.getElementById('passwordForm');
    const toast = document.getElementById('toast');
    const fields = ['oldPassword', 'newPassword', 'confirmPassword'];
    function toggleMenu(force) {
      const open = typeof force === 'boolean' ? force : !userMenu.classList.contains('open');
      userMenu.classList.toggle('open', open);
      userButton.setAttribute('aria-expanded', String(open));
    }
    function setModal(modal, open) {
      modal.classList.toggle('open', open);
      modal.setAttribute('aria-hidden', String(!open));
      if (open) toggleMenu(false);
    }
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function clearErrors() {
      fields.forEach(id => {
        document.getElementById(id + 'Error').textContent = '';
        document.getElementById(id).classList.remove('border-red-500');
      });
    }
    function showError(id, message) {
      document.getElementById(id + 'Error').textContent = message;
      document.getElementById(id).classList.add('border-red-500');
    }
    userButton.addEventListener('click', event => { event.stopPropagation(); toggleMenu(); });
    document.getElementById('changePasswordEntry').addEventListener('click', () => {
      form.reset();
      clearErrors();
      setModal(passwordModal, true);
      document.getElementById('oldPassword').focus();
    });
    document.getElementById('switchRoleEntry').addEventListener('click', () => setModal(roleModal, true));
    document.getElementById('menuLogout').addEventListener('click', () => showToast('已退出登录'));
    document.getElementById('closeModal').addEventListener('click', () => setModal(passwordModal, false));
    document.getElementById('cancelModal').addEventListener('click', () => setModal(passwordModal, false));
    document.getElementById('closeRoleModal').addEventListener('click', () => setModal(roleModal, false));
    document.getElementById('cancelRoleModal').addEventListener('click', () => setModal(roleModal, false));
    document.getElementById('confirmRole').addEventListener('click', () => { setModal(roleModal, false); showToast('角色已切换'); });
    [passwordModal, roleModal].forEach(modal => modal.addEventListener('click', event => { if (event.target === modal) setModal(modal, false); }));
    document.addEventListener('click', () => toggleMenu(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        toggleMenu(false);
        setModal(passwordModal, false);
        setModal(roleModal, false);
      }
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      clearErrors();
      const oldPassword = document.getElementById('oldPassword').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      let valid = true;
      if (!oldPassword) { showError('oldPassword', '请输入原密码'); valid = false; }
      if (!newPassword) { showError('newPassword', '请输入新密码'); valid = false; }
      else if (newPassword.length < 8) { showError('newPassword', '新密码长度不能小于 8 位'); valid = false; }
      else if (!/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) { showError('newPassword', '新密码必须同时包含字母和数字'); valid = false; }
      else if (oldPassword && newPassword === oldPassword) { showError('newPassword', '新密码不能与原密码相同'); valid = false; }
      if (!confirmPassword) { showError('confirmPassword', '请再次输入新密码'); valid = false; }
      else if (newPassword && confirmPassword !== newPassword) { showError('confirmPassword', '两次输入的新密码不一致'); valid = false; }
      if (!valid) return;
      setModal(passwordModal, false);
      showToast('密码修改成功');
    });
  </script>
</body>
</html>
