#auditAnnotationPanel[hidden],#auditAnnotationForm[hidden],#auditAnnotationAdd[hidden],#auditAnnotationDivider[hidden]{display:none}
#auditAnnotationPanel{width:400px;flex:none;overflow:auto;padding:16px 16px 88px;background:#fffbeb;color:#78350f;box-sizing:border-box}
#auditAnnotationDivider{width:8px;flex:none;cursor:col-resize;background:#fde68a;touch-action:none}
#auditAnnotationPanel h2{margin:0 0 8px}
.audit-annotation-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.audit-annotation-tools button{padding:6px 10px;border:1px solid #d97706;background:#fffbeb;color:#78350f;border-radius:6px}
#auditAnnotationStatus{margin:8px 0;min-height:1.5em;font-size:13px}
#auditAnnotationForm{margin:12px 0;padding:12px;background:#fef3c7;border:1px solid #fde68a;border-radius:6px}
#auditAnnotationForm label{display:block;margin:8px 0}
#auditAnnotationForm input,#auditAnnotationForm textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px;background:#fff;border:1px solid #d5b579;border-radius:5px}
#auditAnnotationForm textarea{min-height:64px;resize:vertical}
.audit-annotation-card{margin:12px 0;padding:12px;border:1px solid #fde68a;border-radius:6px;background:#fffbeb}
.audit-annotation-card[data-active]{border-color:#d97706;background:#fef3c7}
.audit-annotation-card summary{cursor:pointer;font-weight:600}
.audit-annotation-card [data-drag-note]{cursor:grab;margin-right:4px;padding:1px 5px;border:0;background:transparent;color:#92400e}
.audit-annotation-card[data-drop-before]{box-shadow:0 -3px #d97706}
.audit-annotation-card[data-drop-after]{box-shadow:0 3px #d97706}
#auditAnnotationScope{margin-left:8px;color:#78350f}
.audit-annotation-section{margin:16px 0 0}
.audit-annotation-section h3{margin:0 0 6px;font-size:14px;font-weight:600;color:inherit}
.audit-annotation-section p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.audit-annotation-number{display:inline-grid;place-items:center;min-width:22px;height:22px;margin:0 6px;padding:0 4px;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:50%;font-size:12px}
#auditAnnotationPins,#auditAnnotationLink{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
#auditAnnotationPins button{position:absolute;margin:0;pointer-events:auto;cursor:pointer}
body.audit-history-annotation #auditAnnotationPins,body.audit-history-annotation #auditAnnotationLink{z-index:21}
body.audit-history-annotation #auditAnnotationToggle{z-index:23}
body.audit-history-annotation #detailMask{right:var(--audit-history-panel-width,0px)}
@media(max-width:768px){body.audit-history-annotation #detailMask{right:0;bottom:var(--audit-history-panel-height,0px)}}
.audit-annotation-highlight{outline:2px solid #d97706!important;outline-offset:-2px}
.audit-annotation-pick{outline:2px dashed #d97706!important;outline-offset:-2px}
#auditAnnotationToggle{position:fixed;right:24px;bottom:24px;z-index:18;width:56px;height:56px;padding:0;border-radius:50%;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;box-shadow:0 3px 10px #92400e33}
#auditAnnotationToggle:hover{background:#fde68a}

function indicatorRows(rows){

  if(row.eventId && row.module==='事件'){
   const valueAt=side=>row.changes.every(change=>change[side]==='—')?'—':
    row.changes.map(change=>change.field+'：'+change[side]).join('\n');
   return [{...row,changes:[{field:row.object,before:valueAt('before'),after:row.type==='删除'?'已删除':valueAt('after')}],
    indicatorIndex:0,operationId:row.id}];
  }
  return row.changes.map((change,index)=>({...row,changes:[change],indicatorIndex:index,operationId:row.id}));
 });
}

function unitHistoryRows(context){return data.filter(r=>r.project===context.project&&r.subject===context.subject&&(context.objectId?r.objectId===context.objectId:r.object===context.object)).sort((a,b)=>b.time.localeCompare(a.time)||b.id.localeCompare(a.id));}
function eventHistoryOptions(project, subject) {
 const latestByEvent = new Map();
 for (const row of data) {
  if (!row.eventId || row.project !== project || row.subject !== subject) continue;
  const latest = latestByEvent.get(row.eventId);
  if (!latest || row.time > latest.time || (row.time === latest.time && row.id > latest.id)) latestByEvent.set(row.eventId, row);
 }
 return [...latestByEvent.values()].sort((a,b)=>b.time.localeCompare(a.time)||b.id.localeCompare(a.id));
}
const historicalEventTypes = ['临床事件','失访事件','退出事件','终点事件'];
function eventBasicInfo(history) {
 const fields = new Map();
 for (const operation of [...history].reverse()) {
  for (const change of operation.changes) {
   const value = operation.type==='删除' ? change.before : change.after;
   if (value!==undefined && value!==null) fields.set(change.field,value);
  }
 }
 return fields;
}
function renderEventInfo(type,fields,deleted=false) {
 const rows=['<div class="event-history-field"><dt>事件类型：</dt><dd>'+esc(type)+
  (deleted?' <span class="tag">已删除</span>':'')+'</dd></div>'];
 const reasons=[];
 const details=[];
 for (const [name,value] of fields) {
  if (name==='失访原因' || name==='退出原因') {
   reasons.push('<section class="event-history-reason"><h4>'+esc(name)+'</h4>'+
    String(value).split('\n').map(line=>'<p>'+esc(line)+'</p>').join('')+'</section>');
  } else if (type==='临床事件' && !['发生时间','核查状态','事件锁定状态'].includes(name)) {
   details.push([name,value]);
  } else if (type==='终点事件' && ['受试者是否完成试验','完成情况'].includes(name)) {
   details.push([name,value]);
  } else {
   rows.push('<div class="event-history-field"><dt>'+esc(name)+'：</dt><dd>'+esc(value)+'</dd></div>');
  }
 }
 const table=details.length?'<table class="event-history-table'+(type==='终点事件'?' terminal':'')+
  '"><thead><tr><th scope="col">'+(type==='临床事件'?'事件名称':'名称')+'</th><th scope="col">具体原因</th></tr></thead><tbody>'+
  details.map(([name,value])=>'<tr><th scope="row">'+esc(name)+'</th><td>'+esc(value)+'</td></tr>').join('')+
  '</tbody></table>':'';
 return '<div class="history-operation-body event-history-info">'+
  '<dl class="event-history-fields">'+rows.join('')+'</dl>'+
  table+reasons.join('')+(!fields.size?'<p>暂无可展示的事件信息</p>':'')+'</div>';
}

    link.href = url;
    link.download = '稽查原型-批注副本.html';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    message('已发起副本下载，原文件未改写。');
  }
  async function save(includeDraft) {
    if (busy) return;
    if (draft && !includeDraft) return message('请先保存或取消当前批注。');
    if (draft && !draft.title.trim()) return message('请填写批注标题。');
    const next = snapshot();
    next.revision = crypto.randomUUID();
    busy = true;
    panel.inert = true;
    let writer;
    try {
      if (!window.showOpenFilePicker) throw new Error('当前浏览器不支持写回原文件，请用桌面版 Chrome 或 Edge 打开原型。');
      if (!handle) [handle] = await window.showOpenFilePicker({
        multiple:false, types:[{description:'当前稽查原型 HTML',accept:{'text/html':['.html']}}]
      });
      const original = await (await handle.getFile()).text();
      const statePattern = /(<script id="auditAnnotationState" type="application\/json">)([\s\S]*?)(<\/script>)/;
      const match = original.match(statePattern);
      if (!match || JSON.parse(match[2]).documentId !== state.documentId) {
        handle = null;
        throw new Error('请选择当前稽查原型的原文件。');
      }
      const diskRevision = JSON.parse(match[2]).revision;
      if (diskRevision !== baseRevision) {
        handle = null;
        throw new Error('原文件中的批注已更新。当前草稿已保留，请核对文件版本。');
      }
      const payload = JSON.stringify(next).replace(/</g, '\\u003c');
      const output = original.replace(statePattern, (_, start, content, end) => start + payload + end);
      writer = await handle.createWritable();
      await writer.write(output);
      await writer.close();
      writer = null;
      if (await (await handle.getFile()).text() !== output) throw new Error('写入后的文件校验失败。');
      if (draft) undo.push(structuredClone(state));
      state = next;
      baseRevision = next.revision;
      draft = null;
      form.hidden = true;
      stateNode.textContent = payload;
      try { localStorage.removeItem(cacheKey); } catch {}
      render();
      message('已保存到原文件：' + handle.name);
    } catch (error) {
      if (writer) { try { await writer.abort(); } catch {} }
      if (error.name === 'NotAllowedError') handle = null;
      cache(error.name === 'AbortError' ? '已取消，草稿仍保留。' : '未写入原文件：' + error.message);
    } finally {
      panel.inert = false;
      busy = false;
    }
  }
  get('Toggle').onclick = () => showPanel(panel.hidden);
  get('Edit').onclick = () => {
    if (draft) return message('请先保存或取消当前批注。');
    stopPicking();
    editing = !editing;
    render();
  };
  get('Add').onclick = () => {
    if (picking) return stopPicking();
    beginPicking();
  };
  get('Undo').onclick = () => {
    if (draft) return message('请先保存或取消当前批注。');
    if (!undo.length) return;
    stopPicking();
    const revision = state.revision;
    const nextId = state.nextId;
    state = undo.pop();
    state.revision = revision;
    state.nextId = nextId;
    cache();
    render();
  };
  get('Save').onclick = () => save(false);
  get('Export').onclick = exportCopy;
  get('Scope').onchange = () => {
    try { localStorage.setItem(cacheKey + ':scope', get('Scope').value); } catch {}
    render();
  };
  function moveCard(sourceId, targetId, after) {
    if (busy || sourceId === targetId) return;
    const from = state.notes.findIndex(note => note.id === sourceId);
    const targetIndex = state.notes.findIndex(note => note.id === targetId);
    if (from < 0 || targetIndex < 0) return;
    const to = targetIndex + Number(after) - Number(from < targetIndex);
    if (from === to) return;
    undo.push(structuredClone(state));
    state.notes.splice(to, 0, state.notes.splice(from, 1)[0]);
    cache();
    render();
    get('Card' + sourceId)?.querySelector('[data-drag-note]')?.focus({preventScroll:true});
  }
  function clearDrop() {
    dropCard?.removeAttribute('data-drop-before');
    dropCard?.removeAttribute('data-drop-after');
    dropCard = null;
  }
  function isAfter(card, y) {
    const header = card.querySelector('summary').getBoundingClientRect();
    return y > header.top + header.height / 2;
  }
  const cards = get('Cards');
  cards.addEventListener('dragstart', event => {
    const grip = event.target.closest('[data-drag-note]');
    if (!grip || busy || draft) {
      event.preventDefault();
      if (draft) message('请先保存或取消当前批注。');
      return;
    }
    stopPicking();
    dragId = Number(grip.dataset.dragNote);
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', String(dragId));
  });
  cards.addEventListener('dragover', event => {
    if (dragId === null) return;
    clearDrop();
    const card = event.target.closest('.audit-annotation-card');
    if (!card || Number(card.dataset.noteId) === dragId) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    dropCard = card;
    card.setAttribute(isAfter(card, event.clientY) ? 'data-drop-after' : 'data-drop-before', '');
  });
  cards.addEventListener('drop', event => {
    if (dragId === null) return;
    event.preventDefault();
    const source = dragId;
    dragId = null;
    clearDrop();
    const card = event.target.closest('.audit-annotation-card');
    if (card) moveCard(source, Number(card.dataset.noteId), isAfter(card, event.clientY));
  });
  cards.addEventListener('dragend', () => { dragId = null; clearDrop(); });
  cards.addEventListener('dragleave', event => {
    if (!cards.contains(event.relatedTarget)) clearDrop();
  });
  cards.addEventListener('keydown', event => {
    const grip = event.target.closest('[data-drag-note]');
    if (!grip || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
    event.preventDefault();
    if (draft) return message('请先保存或取消当前批注。');
    const card = grip.closest('.audit-annotation-card');
    const down = event.key === 'ArrowDown';
    const neighbor = down ? card.nextElementSibling : card.previousElementSibling;
    if (neighbor) {
      stopPicking();
      moveCard(Number(card.dataset.noteId), Number(neighbor.dataset.noteId), down);
    }
  });
  get('Cancel').onclick = () => { draft = null; form.hidden = true; cache(); };
  get('Title').oninput = () => { draft.title = get('Title').value; cache(); };
  form.onsubmit = event => { event.preventDefault(); save(true); };
  document.addEventListener('pointermove', event => {
    if (!picking) return;
    const element = pickable(event.target);
    if (element === hovered) return;
    hovered?.classList.remove('audit-annotation-pick');
    hovered = element;
    hovered?.classList.add('audit-annotation-pick');
  });
  document.addEventListener('click', event => {
    if (!picking || !(historyDrawer() || product).contains(event.target)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const element = pickable(event.target);
    if (!element) return;
    const selector = selectorFor(element);
    const previousId = rebindId;
    stopPicking();
    if (previousId !== null) {
      const note = state.notes.find(item => item.id === previousId);
      if (!note) return;
      undo.push(structuredClone(state));
      note.selector = selector;
      note.page = pageFor(element);
      cache('已重新关联组件。草稿已保存，尚未写入原文件。');
      activeId = note.id;
      render();
      select(note.id, true);
      return;
    }
    const page = pageFor(element);
    const existing = state.notes.find(note => note.selector === selector && notePage(note) === page);
    openDraft(existing ? structuredClone(existing) : {
      id: state.nextId++, selector, page, title:(element.getAttribute('aria-label') || element.textContent.trim() || '新增批注').slice(0,40), sections:{}
    });
  }, true);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') stopPicking(); });
  get('Pins').onclick = event => {
    const id = Number(event.target.dataset.noteId);
    if (!id || busy) return;
    if (draft) return message('请先保存或取消当前批注。');
    if (picking && rebindId === id) return stopPicking();
    select(id, true);
    beginPicking(id);
  };
  get('Pins').addEventListener('pointerover', event => {
    const id = Number(event.target.dataset.noteId);
    if (id && !panel.hidden) { emphasized = true; select(id); }
  });
  get('Pins').addEventListener('pointerout', () => { emphasized = false; schedule(); });
  product.addEventListener('pointerover', event => {
    if (panel.hidden || picking) return;
    const note = state.notes.find(item => onCurrentPage(item) && target(item)?.contains(event.target));
    if (note) { emphasized = true; select(note.id); }
  });
  product.addEventListener('pointerout', () => { emphasized = false; schedule(); });
  const divider = get('Divider');
  function resize(width) {
    const max = Math.max(280, Math.min(650, innerWidth - 360));
    panel.style.width = Math.min(max, Math.max(280, width)) + 'px';
    divider.setAttribute('aria-valuenow', String(Math.round(panel.getBoundingClientRect().width)));
    schedule();
  }
  divider.addEventListener('pointerdown', event => divider.setPointerCapture(event.pointerId));
  divider.addEventListener('pointermove', event => {
    if (divider.hasPointerCapture(event.pointerId)) resize(innerWidth - event.clientX);
  });
  divider.addEventListener('keydown', event => {
    if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    resize(panel.getBoundingClientRect().width + (event.key === 'ArrowLeft' ? 20 : -20));
  });
  document.addEventListener('scroll', schedule, true);
  window.addEventListener('resize', schedule);
  const observer = new ResizeObserver(schedule);
  observer.observe(product);
  observer.observe(panel);
  const pageObserver = new MutationObserver(() => {
    if (renderedPage !== currentPage()) render();
    else schedule();
  });
  pageObserver.observe(product, {childList:true, subtree:true, attributes:true, attributeFilter:['hidden']});
  pageObserver.observe(document.getElementById('detailMask'), {attributes:true, attributeFilter:['class'], childList:true, subtree:true});
  try {
    if (localStorage.getItem(cacheKey + ':scope') === 'all') get('Scope').value = 'all';
  } catch {}
  if (draft) {
    editing = true;
    showPanel(true);
    openDraft(draft);
    message('已恢复未保存的批注草稿。');
  }
  render();
})();
</script>
</body></html>
