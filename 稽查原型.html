<script id="savedNotes" type="application/json">[{"id":1,"target":"auditNav","title":"入口与权限","text":"业务价值：通过记录谁在何时对哪些数据进行了什么操作、修改前后的内容及原因，为核查数据真实性、准确性和完整性提供依据，使每一次变更可追溯，便于发现问题、定位责任和复核研究数据。\n权限说明：全体角色均可见，数据权限沿用项目及中心权限；"},{"id":2,"target":"projectScope","title":"项目范围","text":"范围：默认选中一个项目，单选，不可清空\n加载逻辑：切换项目立即生效，清空其他筛选，返回全部日志并回到第一页；重置保留当前项目。\n数据权限：沿用项目的数据权限，与分中心的筛选做联动"},{"id":3,"target":"filterSection","title":"日志筛选","text":"页面元素：见原型\n交互规则：点击查询生效；日期按天包含首尾，开始日期不可晚于结束日期。"},{"id":4,"target":"tabs","title":"模块与范围","text":"分类页签：CRF、事件、SDV、项目、研究用药；事件仅临床事件、失访、退出、终点。SDV仅对单元锁定和解锁。\n待确认：项目修改与研究用药的具体操作范围。"},{"id":5,"target":"logs","title":"列表与详情","text":"页面元素：参照原型\n交互规则：一次操作对应一条日志，多字段变更在详情展开。长文本可悬停查看；详情列固定右侧。日志不提供修改删除功能。\n排序与数量：操作时间倒序；\n状态与异常：说明区可演示空数据、加载、失败和无权限状态。\n演示假设：无原值用“—”；删除后保留历史内容。详情历史按项目、受试者及同一对象匹配。\n多指标展示：一次保存对应一条日志。列表修改前后列按相同顺序展示前两项指标，超过两项显示总变更数；悬停可读完整内容，详情与导出保留全部指标。肝功能新增4项变更模拟。\nSDV规则：状态值只显示已锁定/未锁定；不记录操作原因。SDV页签隐藏原因列，混合列表显示横线，详情不显示原因区。\n来源字典：科研工作台、科研项目管理、哈瑞特健康、哈瑞特工作室、哈瑞特员工、哈瑞特医疗、数据同步。表示操作发起的平台或渠道"},{"id":6,"target":"exportSection","title":"日志导出","text":"交互规则：导出当前项目、模块和已应用筛选的全部结果。\n"},{"id":7,"target":"caseWorkspace","title":"基线CRF编辑与修改原因","text":"新增规则：修改原因必填，数据与原因同时保存；空白原因、无变化不生成日志，取消丢弃本次输入。日志对象为“基线记录 / 单元”，详情按字段记录前后值。"},{"id":10,"target":"detailOwnership","title":"详情 · 归属信息","text":"作用：确认当前日志所属项目、分中心、受试者及日志模块，避免不同对象的记录混淆。"},{"id":11,"target":"detailOperation","title":"详情 · 操作信息","text":"核对重点：查看操作类型、发生时间、操作人员及当时角色，明确谁在何时执行了操作。\n操作来源：表示操作发起平台或渠道，包含科研工作台、科研项目管理、哈瑞特健康、哈瑞特工作室、哈瑞特员工、哈瑞特医疗、数据同步。"},{"id":12,"target":"detailChanges","title":"详情 · 变更明细","text":"阅读方式：每行对应一个发生变化的字段，左右对照修改前、修改后的值；未变化字段不重复展示。\n多指标变更：一次保存产生一条日志，肝功能示例含4项指标；列表只预览前两项，详情和导出展示全部。\n对象入口：修改对象说明具体记录与单元；“查看当前记录”打开当前数据，当前值可能因后续修改而不同于本条历史日志。\nSDV规则：仅记录单元锁定、解锁及前后状态，不记录操作原因。"},{"id":13,"target":"detailReason","title":"详情 · 操作原因","text":"作用：说明为何修改数据，便于后续核实变更依据。\n填写规则：在CRF单元保存时必填，不能仅输入空格；同一次保存涉及多个指标时共用本次原因。\n历史记录：历史未采集原因不补写为真实原因；SDV操作不展示本区。"},{"id":14,"target":"detailHistory","title":"详情 · 历史记录","text":"作用：追溯同一对象的 function detail(id){

$('saveNotes').onclick=async()=>{captureNoteEdits();const button=$('saveNotes');if(!window.showOpenFilePicker){$('draftState').textContent='当前浏览器不支持写回；草稿已保留，请用Chrome/Edge打开或导出副本';toast('当前浏览器不支持写回原文件');return}button.disabled=true;let writer=null;try{if(!handle){const [picked]=await window.showOpenFilePicker({types:[{description:'原型 HTML',accept:{'text/html':['.html']}}],multiple:false});const original=await(await picked.getFile()).text();if(!original.includes('hrt-audit-v1'))throw new Error('请选择当前数据稽查原型HTML文件');handle=picked}const output=serialized();writer=await handle.createWritable();await writer.write(output);await writer.close();writer=null;const actual=await(await handle.getFile()).text();if(actual!==output)throw new Error('文件回读与写入内容不一致，请导出副本保留批注');$('savedNotes').textContent=JSON.stringify(notes);$('draftState').textContent='已保存并校验：'+handle.name;toast('批注已保存到原文件并校验成功')}catch(e){if(writer)try{await writer.abort()}catch{}handle=null;const reason=e.name==='AbortError'?'已取消选择文件':e.name==='NotAllowedError'?'未获得文件写入权限':e.name==='SecurityError'?'浏览器安全限制，不允许写回文件':e.message||'未知写入错误';$('draftState').textContent=reason+'；编辑草稿已保留，可导出副本';toast(reason+'；草稿保留')}finally{button.disabled=false}};

$('saveNotes').disabled=false;
</script>
</body></html>
